spring:
  # Uygulamanın varsayılan olarak 'docker' profiliyle başlamasını istiyoruz.
  # Bu ayar, docker-compose.yml içinde 'SPRING_PROFILES_ACTIVE' ile de belirtilir.
  profiles:
    active: docker
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 52MB

server:
  port: 5050

jpa:
  hibernate:
    ddl-auto: update
  show-sql: true
  properties:
    hibernate:
      format_sql: true

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION_MS:3600000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# C# İmzalama Mikroservisinin adresi
# Bu adres, Docker network'ü içindeki servis adını kullanır.
signing-service:
  csharp-url: http://eimza-signer-service/api/sign
  api-key: ${SIGNER_API_KEY}


minio:
  url: http://localhost:9000
  access-key: ${MINIO_ROOT_USER}
  secret-key: ${MINIO_ROOT_PASSWORD}
  bucket-name: eimza-documents
