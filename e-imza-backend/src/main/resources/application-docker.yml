# src/main/resources/application-docker.yml

spring:
  datasource:
    # URL'deki "postgres", docker-compose.yml'deki veritabanı servisinin adıdır.
    # URL'in sonundaki "eimza_db", postgres servisindeki POSTGRES_DB değişkeniyle aynıdır.
    url: jdbc:postgresql://postgres:5432/eimza_db
    # docker-compose.yml'deki postgres servisinin kullanıcı adı ve şifresiyle aynı olmalı.
    username: admin
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

minio:
  # "minio", docker-compose.yml'deki MinIO servisinin adıdır.
  url: http://minio:9000
  # docker-compose.yml'deki minio servisinin kullanıcı adı ve şifresiyle aynı olmalı.
  access-key: ${MINIO_ROOT_USER}
  secret-key: ${MINIO_ROOT_PASSWORD}
  bucket-name: eimza-documents


signing-service:

  csharp-url: http://host.docker.internal:5194/api/sign
